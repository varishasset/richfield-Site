<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Requests</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    main {
      padding: 20px;
    }

    .form-section, .requests-section {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #333;
      color: white;
      position: fixed;
      width: 100%;
      bottom: 0;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }

    .previous-requests ul {
      list-style-type: none;
      padding: 0;
    }

    .previous-requests li {
      background-color: #e3e3e3;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }

    .previous-requests h3 {
      margin-top: 0;
    }

  </style>
</head>
<body>
  <header>
    <h1>Feature Requests</h1>
  </header>

  <main>
    <!-- Submit Feature Request Section -->
    <section class="form-section">
      <h2>Submit Feature Request</h2>
      <p>Please fill out the form below to submit a feature request:</p>
      <!-- Embed Tally form -->
      <iframe src="https://tally.so/r/wLokrJ" width="100%" height="600"></iframe>
    </section>

    <!-- Previous Feature Requests Section -->
    <section class="requests-section previous-requests">
      <h3>Previous Feature Requests</h3>
      <ul id="requests-list">
        <!-- This list will be populated by the browser's localStorage -->
      </ul>
    </section>
  </main>

  <footer>
    <p>Powered by Simple Web Technologies</p>
  </footer>

  <script>
    // Load previous feature requests from localStorage when the page loads
    window.onload = function() {
      loadPreviousRequests();
    };

    function loadPreviousRequests() {
      const requestsList = document.getElementById("requests-list");
      
      // Retrieve previous feature requests from localStorage
      let featureRequests = JSON.parse(localStorage.getItem("featureRequests")) || [];

      if (featureRequests.length === 0) {
        requestsList.innerHTML = "<li>No feature requests submitted yet.</li>";
      } else {
        // Clear the existing list first
        requestsList.innerHTML = "";

        // Add each feature request to the list
        featureRequests.forEach(function(request) {
          const li = document.createElement("li");
          li.textContent = request;
          requestsList.appendChild(li);
        });
      }
    }

    // Store the new feature request in localStorage (optional if you want a local store of requests)
    function submitFeatureRequest(request) {
      let featureRequests = JSON.parse(localStorage.getItem("featureRequests")) || [];
      featureRequests.push(request);
      localStorage.setItem("featureRequests", JSON.stringify(featureRequests));
    }
  </script>
</body>
</html>
