<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Requests</title>
  <style>
    /* Basic styling */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    main {
      padding: 20px;
    }

    .form-section, .suggestions-section {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #333;
      color: white;
      position: fixed;
      width: 100%;
      bottom: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Feature Requests and Voting</h1>
    <p>College students and staff can submit feature requests and vote on them!</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Submit Your Feature Request</h2>
      <p>Fill out the form below to submit your feature requests and vote on others' suggestions.</p>
      <!-- Embed the Tally.so form here -->
      <iframe src="https://tally.so/embed/xyz" width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0" style="border: none; min-width: 100%; min-height: 500px; overflow: hidden;"></iframe>
    </section>
  </main>

  <footer>
    <p>Powered by Simple Web Technologies</p>
  </footer>
</body>
</html>
