<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Richfield Feature Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    main {
      padding: 20px;
    }

    .section {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 40px;
    }

    h2 {
      margin-top: 0;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #333;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Richfield Feature Requests</h1>
  </header>

  <main>
    <!-- Feature Request Form -->
    <section class="section">
      <h2>Submit a Feature Request</h2>
      <p>Have an idea or something you'd love to see? Submit it below:</p>
      <iframe src="https://tally.so/r/wLokrJ" allowfullscreen></iframe>
    </section>

    <!-- Polls Section -->
    <section class="section">
      <h2>Polls</h2>
      <p>Vote on current features and ideas being considered:</p>
      <iframe src="https://tally.so/r/wdRvMV" allowfullscreen></iframe>
    </section>
  </main>

  <footer>
    <p>Built with ❤️ for Richfield students & staff</p>
  </footer>
</body>
</html>
